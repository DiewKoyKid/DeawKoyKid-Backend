name: Backend CI
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: backend_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d backend_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/backend_test
      DIRECT_URL: postgresql://test:test@localhost:5432/backend_test
      JWT_SECRET: ci-only-not-a-deployment-secret
      NODE_ENV: test
      STORAGE_DRIVER: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:migrate
      - run: npm test
      - run: npm audit --audit-level=high
      - run: docker build --target runtime -t backend:test .
      - run: docker build --target migration -t backend-migration:test .
